# Self-hosted Convex backend + dashboard for Mavladi Mandli, behind Caddy (automatic HTTPS).
# Based on the official compose file:
#   https://github.com/get-convex/convex-backend/tree/main/self-hosted/docker
#
#   cp .env.example .env      # fill in your domains
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh
#
# The frontend on Vercel (HTTPS) must reach the backend over HTTPS, hence Caddy.
services:
  backend:
    # Pinned on purpose: `latest` means an unattended `docker compose pull` can
    # change the engine running your payments mid-event. Bump deliberately, and
    # not during the festival. Find tags at:
    #   https://github.com/get-convex/convex-backend/pkgs/container/convex-backend
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    volumes:
      - data:/convex/data # database (SQLite by default) + uploaded screenshots
    environment:
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - CONVEX_CLOUD_ORIGIN=https://${CONVEX_API_DOMAIN}
      - CONVEX_SITE_ORIGIN=https://${CONVEX_SITE_DOMAIN:-${CONVEX_API_DOMAIN}}
      - DATABASE_URL
      - POSTGRES_URL
      - DISABLE_BEACON
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # The dashboard has full database access behind a single admin key, so it is
  # NOT published. Bound to loopback only — reach it with an SSH tunnel:
  #   ssh -L 6791:127.0.0.1:6791 you@your-server   → http://localhost:6791
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_DASHBOARD_TAG:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=https://${CONVEX_API_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CONVEX_API_DOMAIN
      - CONVEX_DASHBOARD_DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - dashboard

volumes:
  data:
  caddy_data:
  caddy_config:
